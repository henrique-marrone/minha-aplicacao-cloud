<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minha primeira aplicação publicada na nuvem.">
  <title>Minha Aplicação Cloud</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="cloud-card" aria-labelledby="titulo">
      <div class="cloud-icon" aria-hidden="true">☁</div>
      <p class="eyebrow">AULA 08 · CLOUD COMPUTING</p>
      <h1 id="titulo">MINHA APLICAÇÃO CLOUD</h1>
      <div class="divider"></div>

      <label for="nome">Nome:</label>
      <input
        id="nome"
        type="text"
        placeholder="Digite seu nome"
        maxlength="60"
        autocomplete="name"
      >

      <p class="message" id="mensagem">
        Minha primeira aplicação está executando na nuvem!
      </p>

      <button id="botao" type="button">Personalizar mensagem</button>
      <p class="status" id="status" role="status" aria-live="polite">
        Aplicação carregada com sucesso.
      </p>
    </section>

    <footer>
      Projeto acadêmico · HTML, CSS e JavaScript
    </footer>
  </main>
</body>
</html>
